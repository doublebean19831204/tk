<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 署名（请勿删除 / DO NOT REMOVE）| 制作人：徐徐 | 微信：doublebean_vip -->

    <title>题库系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #eef1f6;
            color: #1f2d3d;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 应用外框 ===== */
        .app {
            max-width: 920px;
            margin: 0 auto;
            min-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 24px rgba(31, 45, 61, .08);
        }

        @media (min-width: 960px) {
            body { padding: 28px 16px; }
            .app {
                min-height: calc(100vh - 56px);
                border: 1px solid #e3e8ee;
                border-radius: 14px;
                overflow: hidden;
            }
        }

        /* ===== 顶栏 ===== */
        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            border-bottom: 1px solid #e8ebf0;
            background: #fff;
        }

        .app-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4c7dff, #6a5cff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 17px;
            font-weight: 700;
            color: #1f2d3d;
        }

        .app-subtitle {
            font-size: 12px;
            color: #8a94a6;
            font-weight: 400;
            margin-left: 8px;
        }

        .header-progress {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
        }

        .progress {
            background: #e8ebf0;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            flex: 1;
        }

        .progress-bar {
            background: linear-gradient(90deg, #4c7dff, #6a5cff);
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        #progressText {
            font-size: 12px;
            color: #8a94a6;
            white-space: nowrap;
        }

        /* ===== 分类标签栏 ===== */
        .category-selector {
            display: flex;
            gap: 2px;
            padding: 0 16px;
            border-bottom: 1px solid #e8ebf0;
            background: #fff;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-selector::-webkit-scrollbar { display: none; }

        /* 每个分类与其错题本上下两行对齐成一组 */
        .cat-group {
            display: flex;
            flex-direction: column;
        }

        .cat-group + .cat-group {
            border-left: 1px solid #eef1f4;
        }

        .category-btn {
            border: none;
            background: transparent;
            color: #5a6b7b;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 18px 8px;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            text-align: center;
            transition: color .2s ease, background .2s ease;
        }

        .category-btn:hover { color: #3d7bff; background: #f5f8ff; }

        .category-btn.active {
            color: #3d7bff;
            border-bottom-color: #3d7bff;
        }

        /* 第二行：错题本（副行，字号略小） */
        .category-btn.wrong-btn {
            color: #b85c5c;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 18px 8px;
        }
        .category-btn.wrong-btn:hover { color: #d64545; background: #fff5f5; }
        .category-btn.wrong-btn.active { color: #d64545; border-bottom-color: #d64545; }

        /* ===== 模式切换（答题 / 背题） ===== */
        .mode-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px 24px;
            background: #fff;
            border-bottom: 1px solid #e8ebf0;
        }

        .mode-btn {
            padding: 9px 0;
            border: 1px solid #dfe4ea;
            background: #f7f9fc;
            color: #5a6b7b;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s ease;
        }

        .mode-btn:hover { border-color: #b9c8ff; color: #3d7bff; }

        .mode-btn.active {
            background: #4c7dff;
            border-color: #4c7dff;
            color: #fff;
            box-shadow: 0 2px 8px rgba(76, 125, 255, .25);
        }

        /* ===== 背题模式列表 ===== */
        .mem-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mem-card {
            background: #fff;
            border: 1px solid #e8ebf0;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 1px 3px rgba(31, 45, 61, .04);
        }

        .mem-card .q-head { margin-bottom: 10px; }
        .mem-card .question-text { margin-bottom: 14px; }
        .mem-card .option { cursor: default; }
        .mem-card .option:hover { border-color: #e3e8ee; background: #fff; }
        .mem-card .option.is-correct,
        .mem-card .option.is-correct:hover { border-color: #bfe8d2; background: #f4fbf7; }

        .mem-answer {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #1d9e63;
        }

        .mem-explain {
            margin-top: 8px;
            font-size: 13px;
            color: #8a94a6;
            line-height: 1.7;
        }

        @media (max-width: 640px) {
            .mode-switch { padding: 10px 14px; }
            .mem-card { padding: 16px 14px; }
        }

        /* ===== 主体 ===== */
        #quizContent {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            padding: 10px 24px;
            background: #fafbfc;
            border-bottom: 1px solid #eef1f4;
        }

        .toolbar span { font-size: 12px; color: #8a94a6; }

        .toolbar input {
            width: 64px;
            padding: 6px 8px;
            border: 1px solid #dfe4ea;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            outline-color: #4c7dff;
        }

        .app-main {
            flex: 1;
            padding: 24px;
            background: #f7f9fc;
            overflow-y: auto;
        }

        .question-section {
            background: #fff;
            border: 1px solid #e8ebf0;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 1px 3px rgba(31, 45, 61, .04);
        }

        .q-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .question-number {
            color: #8a94a6;
            font-size: 13px;
            font-weight: 600;
        }

        .qtype-badge {
            background: #e8f0ff;
            color: #3d7bff;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .question-text {
            font-size: 16.5px;
            color: #1f2d3d;
            font-weight: 600;
            line-height: 1.75;
            margin-bottom: 20px;
        }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .option {
            display: flex;
            align-items: flex-start;
            padding: 12px 14px;
            border: 1px solid #e3e8ee;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            transition: all .15s ease;
        }

        .option:hover { border-color: #b9c8ff; background: #f8faff; }
        .option input { display: none; }
        .option.selected { border-color: #4c7dff; background: #f0f5ff; }

        .option-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f0f2f5;
            border: 1px solid #dfe4ea;
            color: #5a6b7b;
            font-size: 13px;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .option.selected .option-circle { background: #4c7dff; border-color: #4c7dff; color: #fff; }
        .option.is-correct .option-circle { background: #26bf7a; border-color: #26bf7a; color: #fff; }
        .option.is-wrongpick .option-circle { background: #f4504c; border-color: #f4504c; color: #fff; }
        .option.is-correct { border-color: #bfe8d2; background: #f4fbf7; }
        .option.is-wrongpick { border-color: #f5c4c2; background: #fef6f5; }
        .option.is-correct .option-label { color: #1d9e63; font-weight: 700; }
        .option.is-wrongpick .option-label { color: #d64545; }
        .option.answered { pointer-events: none; }

        .option-label {
            flex: 1;
            user-select: none;
            line-height: 1.6;
            font-size: 15px;
            color: #33414f;
            padding-top: 2px;
        }

        .answer-line {
            display: none;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed #e0e4ea;
            font-size: 15px;
            font-weight: 700;
            color: #33414f;
            gap: 28px;
            flex-wrap: wrap;
        }
        .answer-line.show { display: flex; }
        .ans-correct { color: #1d9e63; }
        .ans-wrong { color: #d64545; }

        .answer-stats {
            display: none;
            margin-top: 10px;
            color: #9aa5b1;
            font-size: 12px;
            line-height: 1.9;
        }
        .answer-stats.show { display: block; }

        .result-section {
            display: none;
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            background: #f7f9fc;
            border-left: 3px solid #4c7dff;
        }
        .result-section.show { display: block; }
        .result-section.correct,
        .result-section.incorrect {
            background: #f7f9fc;
            border-left: 3px solid #4c7dff;
        }
        .result-title { font-size: 13px; font-weight: 700; color: #5a6b7b; margin-bottom: 6px; }
        .result-section.correct .result-title,
        .result-section.incorrect .result-title { color: #5a6b7b; }
        .result-text { color: #4a5866; font-size: 14px; line-height: 1.7; }

        .empty-tip {
            text-align: center;
            color: #8a94a6;
            padding: 60px 20px;
            font-size: 15px;
            line-height: 2;
            background: #fff;
            border: 1px dashed #dfe4ea;
            border-radius: 12px;
        }

        /* ===== 底部操作栏 ===== */
        .buttons {
            display: flex;
            gap: 12px;
            padding: 14px 24px;
            border-top: 1px solid #e8ebf0;
            background: #fff;
        }

        button { font-family: inherit; }

        .btn-prev, .btn-next, .btn-submit {
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 0;
            cursor: pointer;
            transition: all .15s ease;
        }

        .btn-prev { flex: 1; background: #fff; color: #5a6b7b; border: 1px solid #dfe4ea; }
        .btn-prev:hover:not(:disabled) { background: #f2f4f8; color: #33414f; }
        .btn-submit { flex: 1.4; background: #4c7dff; color: #fff; }
        .btn-submit:hover { background: #3a6ae8; }
        .btn-next { flex: 1; background: #1f2d3d; color: #fff; }
        .btn-next:hover { background: #33414f; }

        button:disabled { opacity: .45; cursor: not-allowed; }

        #masterBtn { flex: 1.2; align-self: center; }

        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all .15s ease;
        }
        .btn-jump { background: #4c7dff; color: #fff; }
        .btn-jump:hover { background: #3a6ae8; }
        .btn-reset { background: #fff; color: #d64545; border: 1px solid #f2c4c4; }
        .btn-reset:hover { background: #d64545; color: #fff; border-color: #d64545; }
        .btn-clearwrong { background: #fff; color: #e08a00; border: 1px solid #f5d9a8; }
        .btn-clearwrong:hover { background: #e08a00; color: #fff; border-color: #e08a00; }

        /* ===== 完成页 ===== */
        .completion {
            display: none;
            text-align: center;
            background: #fff;
            border: 1px solid #e8ebf0;
            border-radius: 12px;
            margin: 24px;
            padding: 48px 32px;
        }
        .completion.show { display: block; }
        .completion h2 { font-size: 22px; color: #1f2d3d; margin-bottom: 8px; }
        .score { font-size: 40px; color: #4c7dff; font-weight: 800; margin: 12px 0 6px; }
        .score-text { color: #8a94a6; font-size: 15px; margin-bottom: 28px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-item { padding: 14px 10px; background: #f7f9fc; border: 1px solid #eef1f4; border-radius: 10px; }
        .stat-number { font-size: 20px; font-weight: 800; color: #4c7dff; }
        .stat-label { font-size: 12px; color: #8a94a6; margin-top: 4px; }
        .btn-restart {
            background: #4c7dff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-restart:hover { background: #3a6ae8; }

        .site-footer { padding-bottom: 14px; }

        /* ===== 移动端适配 ===== */
        @media (max-width: 640px) {
            .app-header { padding: 12px 16px; flex-wrap: wrap; }
            .header-progress { min-width: 100%; order: 3; }
            .app-subtitle { display: none; }
            .toolbar { justify-content: center; padding: 8px 12px; }
            .app-main { padding: 14px; }
            .question-section { padding: 18px 16px; }
            .buttons { padding: 12px 14px; }
            .completion { margin: 14px; padding: 32px 18px; }
        }
/* SIG:BEGIN:css */
        /* ===== 署名样式（请勿删除 / DO NOT REMOVE） ===== */
        .site-footer {
            margin-top: 22px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            color: #c4c4c4;
            font-size: 11px;
            line-height: 1.6;
            opacity: .8;
        }

        .site-footer .sig-sep {
            color: #ddd;
        }

        .site-footer .sig-qr {
            width: 54px;
            height: 54px;
            margin-left: 4px;
            opacity: .45;
            filter: grayscale(1);
            transition: opacity .25s ease;
        }

        .site-footer:hover .sig-qr {
            opacity: .85;
        }
/* SIG:END:css */
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="app-logo">📚</div>
            <div class="app-title">题库系统<span class="app-subtitle">建设工程安全知识练习</span></div>
            <div class="header-progress">
                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <span id="progressText"></span>
            </div>
        </header>

        <div class="mode-switch">
            <button class="mode-btn active" id="modeQuizBtn" onclick="setMode('quiz')">答题模式</button>
            <button class="mode-btn" id="modeMemBtn" onclick="setMode('memorize')">背题模式</button>
        </div>

        <nav class="category-selector" id="categorySelector"></nav>

        <div id="quizContent">
            <div class="toolbar">
                <span>跳转到第</span>
                <input type="number" id="jumpInput" min="1" placeholder="题号">
                <span>题</span>
                <button class="btn-small btn-jump" onclick="jumpToQuestion()">跳转</button>
                <button class="btn-small btn-reset" onclick="resetProgress()">重置进度</button>
                <button class="btn-small btn-clearwrong" id="clearWrongBtn" onclick="clearWrong()" style="display:none;">清空错题本</button>
            </div>

            <main class="app-main">
                <div class="question-section" id="questionSection">
                    <div class="q-head">
                        <span class="question-number" id="questionNumber"></span>
                        <span class="qtype-badge" id="qtypeBadge"></span>
                    </div>
                    <div class="question-text" id="questionText"></div>
                    <div class="options" id="optionsContainer"></div>
                    <div class="answer-line" id="answerLine"></div>
                    <div class="answer-stats" id="answerStats"></div>
                    <div class="result-section" id="resultSection">
                        <div class="result-title" id="resultTitle"></div>
                        <div class="result-text" id="resultText"></div>
                    </div>
                </div>

                <div class="empty-tip" id="emptyTip" style="display:none;">
                    🎉 错题本是空的！<br>做错的题目会自动收集到这里，方便你针对性复习。
                </div>
            </main>

            <div class="buttons">
                <button class="btn-prev" id="prevBtn" onclick="prevQuestion()">上一页</button>
                <button class="btn-submit" id="submitBtn" onclick="submitAnswer()">确定</button>
                <button class="btn-next" id="nextBtn" onclick="nextQuestion()">下一页</button>
                <button class="btn-small btn-clearwrong" id="masterBtn" onclick="masterCurrent()" style="display: none;">已掌握，移出错题本</button>
            </div>
        </div>

        <main class="app-main" id="memContent" style="display:none;">
            <div class="mem-list" id="memList"></div>
            <div class="empty-tip" id="memEmptyTip" style="display:none;">
                🎉 错题本是空的！<br>做错的题目会自动收集到这里，方便你针对性复习。
            </div>
        </main>

        <div class="completion" id="completionSection">
            <h2>🎉 完成了！</h2>
            <div class="score" id="finalScore"></div>
            <div class="score-text" id="scoreText"></div>
            <div class="stats" id="stats"></div>
            <button class="btn-restart" onclick="restart()">重新开始</button>
        </div>

<!-- SIG:BEGIN:footer -->
        <!-- 署名（请勿删除 / DO NOT REMOVE）| 制作人：徐徐 | 微信：doublebean_vip -->
        <footer class="site-footer" id="siteFooter">
            <span class="sig-line">制作人：徐徐</span>
            <span class="sig-sep">·</span>

    </div>

    <script src="questions-data.js"></script>
    <script>
        const WRONG_PREFIX = '错题·';
        const isWrong = (c) => c.startsWith(WRONG_PREFIX);
        const realCat = (c) => c.slice(WRONG_PREFIX.length);
        const LS_PROGRESS = 'quiz_progress_v1';
        const LS_WRONG = 'quiz_wrong_v1';
        const LS_LAST = 'quiz_last_category_v1';
        const LS_STATS = 'quiz_stats_v1';
        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

        let quizData = {};
        let currentCategory = '';
        // activeList: 当前视图的题目指针数组 [{category, index, question}]
        let activeList = [];
        let currentQuestionIndex = 0;
        let answered = false;
        const LS_MODE = 'quiz_mode_v1';
        let currentMode = localStorage.getItem(LS_MODE) || 'quiz';

        // 加载题库数据：优先使用内嵌的 questions-data.js（双击即可用），
        // 如果不存在再尝试从 questions.json 加载（需本地服务器）。
/* SIG:BEGIN:strip */
        // 剥离下划线开头的署名/元数据键，避免其出现在分类列表中
        // （署名信息本身仍完整保留在文件里）
        function stripSignatureMeta(data) {
            const out = {};
            Object.keys(data || {}).forEach(function (k) {
                if (!k.startsWith('_')) out[k] = data[k];
            });
            return out;
        }
/* SIG:END:strip */

        async function loadQuizData() {
            if (window.QUIZ_DATA && Object.keys(window.QUIZ_DATA).length > 0) {
                quizData = stripSignatureMeta(window.QUIZ_DATA);
                init();
                return;
            }
            try {
                const response = await fetch('questions.json');
                quizData = stripSignatureMeta(await response.json());
                init();
            } catch (error) {
                console.error('加载题库失败:', error);
                alert('无法加载题库数据。请确保 questions-data.js 文件存在。');
            }
        }

        document.addEventListener('DOMContentLoaded', loadQuizData);

        // ===== 本地存储工具 =====
        function loadProgress() {
            try { return JSON.parse(localStorage.getItem(LS_PROGRESS)) || {}; }
            catch (e) { return {}; }
        }
        function saveProgressMap(map) {
            localStorage.setItem(LS_PROGRESS, JSON.stringify(map));
        }
        function loadWrong() {
            try { return JSON.parse(localStorage.getItem(LS_WRONG)) || {}; }
            catch (e) { return {}; }
        }
        function saveWrong(map) {
            localStorage.setItem(LS_WRONG, JSON.stringify(map));
        }

        // 把当前分类的进度（题号）存起来
        function persistCurrentIndex() {
            const map = loadProgress();
            map[currentCategory] = currentQuestionIndex;
            saveProgressMap(map);
            localStorage.setItem(LS_LAST, currentCategory);
        }

        // 记录/移除错题
        function addWrong(category, index) {
            if (isWrong(category)) return;
            const map = loadWrong();
            if (!map[category]) map[category] = [];
            if (!map[category].includes(index)) {
                map[category].push(index);
                saveWrong(map);
            }
        }
        function removeWrong(category, index) {
            const map = loadWrong();
            if (map[category]) {
                map[category] = map[category].filter(i => i !== index);
                if (map[category].length === 0) delete map[category];
                saveWrong(map);
            }
        }
        function wrongCountOf(cat) {
            const map = loadWrong();
            return (map[cat] || []).length;
        }
        function buildWrongList(cat) {
            const map = loadWrong();
            const list = [];
            (map[cat] || []).forEach(idx => {
                if (quizData[cat] && quizData[cat][idx]) {
                    list.push({ category: cat, index: idx, question: quizData[cat][idx] });
                }
            });
            return list;
        }

        // ===== 初始化 =====
        function init() {
            syncModeButtons();
            renderCategoryButtons();
            // 恢复上次所在分类
            const last = localStorage.getItem(LS_LAST);
            const first = Object.keys(quizData)[0];
            const target = (last && (quizData[last] || (isWrong(last) && quizData[realCat(last)]))) ? last : first;
            selectCategory(target, true);
        }

        function renderCategoryButtons() {
            const selector = document.getElementById('categorySelector');
            selector.innerHTML = '';
            Object.keys(quizData).forEach(category => {
                // 一组 = 上下两行：第一行分类，第二行对应错题本
                const group = document.createElement('div');
                group.className = 'cat-group';

                const btn = document.createElement('button');
                btn.className = 'category-btn' + (category === currentCategory ? ' active' : '');
                btn.textContent = category;
                btn.onclick = () => selectCategory(category);
                group.appendChild(btn);

                const wid = WRONG_PREFIX + category;
                const wbtn = document.createElement('button');
                const wc = wrongCountOf(category);
                wbtn.className = 'category-btn wrong-btn' + (currentCategory === wid ? ' active' : '');
                wbtn.textContent = `${category}·错题(${wc})`;
                wbtn.onclick = () => selectCategory(wid);
                group.appendChild(wbtn);

                selector.appendChild(group);
            });
        }

        // 构建当前分类的 activeList
        function buildActiveList(category) {
            if (isWrong(category)) {
                return buildWrongList(realCat(category));
            }
            return quizData[category].map((q, i) => ({ category, index: i, question: q }));
        }

        function selectCategory(category, restore) {
            // 先保存旧分类进度
            if (currentCategory && activeList.length >= 0) {
                persistCurrentIndex();
            }
            currentCategory = category;
            activeList = buildActiveList(category);

            // 恢复该分类的进度
            const map = loadProgress();
            let idx = (restore || map[category] !== undefined) ? (map[category] || 0) : 0;
            if (idx >= activeList.length) idx = 0;
            currentQuestionIndex = idx;
            answered = false;

            document.getElementById('clearWrongBtn').style.display =
                isWrong(category) ? 'inline-block' : 'none';

            renderCategoryButtons();
            renderCurrentView();
        }

        // ===== 模式切换 =====
        function syncModeButtons() {
            document.getElementById('modeQuizBtn').classList.toggle('active', currentMode === 'quiz');
            document.getElementById('modeMemBtn').classList.toggle('active', currentMode === 'memorize');
        }

        function setMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            localStorage.setItem(LS_MODE, mode);
            syncModeButtons();
            renderCurrentView();
        }

        // 根据当前模式渲染主区域
        function renderCurrentView() {
            document.getElementById('completionSection').classList.remove('show');
            const mem = currentMode === 'memorize';
            document.getElementById('memContent').style.display = mem ? 'block' : 'none';
            document.getElementById('quizContent').style.display = mem ? 'none' : 'flex';
            if (mem) renderMemorize();
            else renderQuestion();
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ===== 背题模式：全部题目 + 直接标出正确答案 =====
        function renderMemorize() {
            const list = document.getElementById('memList');
            const emptyTip = document.getElementById('memEmptyTip');
            list.innerHTML = '';

            if (activeList.length === 0) {
                emptyTip.style.display = 'block';
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').textContent = '';
                return;
            }
            emptyTip.style.display = 'none';

            const baseCat = isWrong(currentCategory) ? realCat(currentCategory) : currentCategory;

            activeList.forEach((pointer, n) => {
                const q = pointer.question;
                const isMultiple = Array.isArray(q.correct);
                const correctIdx = isMultiple ? q.correct.slice() : [q.correct];

                let optHtml = '';
                q.options.forEach((opt, i) => {
                    const isCor = correctIdx.includes(i);
                    const text = escapeHtml(opt.replace(/^[A-Ha-h][.、．]\s*/, ''));
                    optHtml += `<div class="option${isCor ? ' is-correct' : ''}">
                        <span class="option-circle">${isCor ? '✓' : LETTERS[i]}</span>
                        <span class="option-label">${text}</span>
                    </div>`;
                });

                const badge = baseCat.includes('判断') ? '判断' : (isMultiple ? '多选' : '单选');
                const ansText = correctIdx.slice().sort((a, b) => a - b).map(i => LETTERS[i]).join('、');

                const card = document.createElement('div');
                card.className = 'mem-card';
                card.innerHTML = `
                    <div class="q-head">
                        <span class="question-number">第 ${n + 1} 题</span>
                        <span class="qtype-badge">${badge}</span>
                    </div>
                    <div class="question-text">${escapeHtml(q.question)}</div>
                    <div class="options">${optHtml}</div>
                    <div class="mem-answer">正确答案：${ansText}</div>
                    ${q.explanation ? `<div class="mem-explain">💡 ${escapeHtml(q.explanation)}</div>` : ''}
                `;
                list.appendChild(card);
            });

            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = `背题 · 共 ${activeList.length} 题`;
        }

        function renderQuestion() {
            const emptyTip = document.getElementById('emptyTip');
            const qSection = document.getElementById('questionSection');
            const buttons = document.querySelector('.buttons');

            // 错题本为空
            if (activeList.length === 0) {
                qSection.style.display = 'none';
                buttons.style.display = 'none';
                emptyTip.style.display = 'block';
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').textContent = '';
                return;
            }
            qSection.style.display = 'block';
            buttons.style.display = 'flex';
            emptyTip.style.display = 'none';

            const pointer = activeList[currentQuestionIndex];
            const question = pointer.question;
            const isMultiple = Array.isArray(question.correct);

            let label = `第 ${currentQuestionIndex + 1} 题 / 共 ${activeList.length} 题`;
            if (isWrong(currentCategory)) {
                label = `错题复习 · ${label}`;
            }
            document.getElementById('questionNumber').textContent = label;
            document.getElementById('questionText').textContent = question.question;

            // 题型徽章：单选 / 多选 / 判断
            const baseCat = isWrong(currentCategory) ? realCat(currentCategory) : currentCategory;
            document.getElementById('qtypeBadge').textContent =
                baseCat.includes('判断') ? '判断' : (isMultiple ? '多选' : '单选');

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            question.options.forEach((option, index) => {
                const lbl = document.createElement('label');
                lbl.className = 'option';
                const inputType = isMultiple ? 'checkbox' : 'radio';
                // 去掉选项文字自带的 "A. " 前缀，字母改由圆圈展示
                const text = option.replace(/^[A-Ha-h][.、．]\s*/, '');
                lbl.innerHTML = `
                    <input type="${inputType}" name="answer" value="${index}">
                    <span class="option-circle">${LETTERS[index]}</span>
                    <span class="option-label">${text}</span>
                `;
                lbl.onclick = () => {
                    if (answered) return;
                    if (isMultiple) {
                        const input = lbl.querySelector('input');
                        if (input) input.checked = !input.checked;
                        updateMultipleSelection();
                    } else {
                        selectOption(index);
                    }
                };
                container.appendChild(lbl);
            });

            document.getElementById('resultSection').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('answerLine').classList.remove('show');
            document.getElementById('answerStats').classList.remove('show');
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('masterBtn').style.display = 'none';
            // 翻页按钮状态：第一题禁用「上一页」；最后一题的「下一页」会进入完成页
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent =
                currentQuestionIndex >= activeList.length - 1 ? '完成' : '下一页';
            answered = false;

            persistCurrentIndex();
            updateProgress();
        }

        // ===== 上一页 =====
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function updateMultipleSelection() {
            document.querySelectorAll('.option').forEach(opt => {
                if (opt.querySelector('input:checked')) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }

        function selectOption(index) {
            document.querySelectorAll('.option input[type="radio"]').forEach(radio => {
                radio.checked = false;
            });
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelectorAll('.option input[type="radio"]')[index].checked = true;
            document.querySelectorAll('.option')[index].classList.add('selected');
        }

        function submitAnswer() {
            const pointer = activeList[currentQuestionIndex];
            const question = pointer.question;
            const isMultiple = Array.isArray(question.correct);

            const selectedElements = document.querySelectorAll('input[type="' + (isMultiple ? 'checkbox' : 'radio') + '"]:checked');
            if (selectedElements.length === 0) {
                alert('请选择答案');
                return;
            }

            const selectedIndices = Array.from(selectedElements).map(el => parseInt(el.value)).sort((a, b) => a - b);

            let isCorrect = false;
            if (isMultiple) {
                const correctIndices = question.correct.slice().sort((a, b) => a - b);
                isCorrect = JSON.stringify(selectedIndices) === JSON.stringify(correctIndices);
            } else {
                isCorrect = selectedIndices[0] === question.correct;
            }

            answered = true;

            // 记录错题：错题本可反复练习，答对不自动移除，仅手动「移出」或「清空」时删除
            if (!isCorrect) {
                addWrong(pointer.category, pointer.index);
                renderCategoryButtons();
            }

            showResult(isCorrect, question.explanation);
            markOptions(question, selectedIndices, isMultiple);
            showAnswerLine(question, selectedIndices, isCorrect, isMultiple);
            showAnswerStats(pointer, isCorrect);

            document.getElementById('submitBtn').style.display = 'none';
            // 错题本模式下，答完显示「已掌握，移出错题本」按钮
            document.getElementById('masterBtn').style.display =
                isWrong(currentCategory) ? 'block' : 'none';
        }

        // ===== 答题后在选项上直接标记对错 =====
        function markOptions(question, selectedIndices, isMultiple) {
            const correctIdx = isMultiple ? question.correct.slice() : [question.correct];
            document.querySelectorAll('.option').forEach((opt, i) => {
                opt.classList.add('answered');
                opt.classList.remove('selected');
                const circle = opt.querySelector('.option-circle');
                if (correctIdx.includes(i)) {
                    opt.classList.add('is-correct');
                    if (circle) circle.textContent = '✓';
                } else if (selectedIndices.includes(i)) {
                    opt.classList.add('is-wrongpick');
                    if (circle) circle.textContent = '✕';
                }
            });
        }

        // ===== 底部「正确答案 / 您选择」=====
        function showAnswerLine(question, selectedIndices, isCorrect, isMultiple) {
            const correctIdx = (isMultiple ? question.correct.slice() : [question.correct])
                .sort((a, b) => a - b);
            const ansText = correctIdx.map(i => LETTERS[i]).join('、');
            const selText = selectedIndices.map(i => LETTERS[i]).join('、');
            const line = document.getElementById('answerLine');
            line.innerHTML = `
                <span>正确答案 <span class="ans-correct">${ansText}</span></span>
                <span>您选择 <span class="${isCorrect ? 'ans-correct' : 'ans-wrong'}">${selText}</span></span>
            `;
            line.classList.add('show');
        }

        // ===== 作答统计（本人 / 累计）=====
        function loadStats() {
            try { return JSON.parse(localStorage.getItem(LS_STATS)) || {}; }
            catch (e) { return {}; }
        }
        function showAnswerStats(pointer, isCorrect) {
            const map = loadStats();
            const key = pointer.category + '#' + pointer.index;
            if (!map[key]) map[key] = { tries: 0, correct: 0 };
            if (!map.__total) map.__total = { tries: 0, correct: 0 };
            map[key].tries++;
            map.__total.tries++;
            if (isCorrect) { map[key].correct++; map.__total.correct++; }
            localStorage.setItem(LS_STATS, JSON.stringify(map));

            const q = map[key], t = map.__total;
            const pct = q.tries ? Math.round(q.correct / q.tries * 100) : 0;
            const tpct = t.tries ? Math.round(t.correct / t.tries * 100) : 0;
            const box = document.getElementById('answerStats');
            box.innerHTML =
                `本人作答：${q.tries}次　正确率：${pct}%<br>` +
                `累计作答：${t.tries}次　正确率：${tpct}%`;
            box.classList.add('show');
        }

        function showResult(isCorrect, explanation) {
            const resultSection = document.getElementById('resultSection');
            const resultTitle = document.getElementById('resultTitle');
            const resultText = document.getElementById('resultText');
            // 与刷题App一致：不再显示大块对错横幅，仅在有解析时展示解析
            if (!explanation) {
                resultSection.classList.remove('show', 'correct', 'incorrect');
                return;
            }
            resultSection.className = 'result-section show ' + (isCorrect ? 'correct' : 'incorrect');
            resultTitle.textContent = '💡 解析';
            resultText.textContent = explanation;
        }

        function nextQuestion() {
            if (currentQuestionIndex < activeList.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showCompletion();
            }
        }

        function showCompletion() {
            document.getElementById('quizContent').style.display = 'none';
            const completion = document.getElementById('completionSection');
            completion.classList.add('show');

            document.getElementById('finalScore').textContent =
                isWrong(currentCategory) ? `${realCat(currentCategory)}·错题` : `${currentCategory}`;
            document.getElementById('scoreText').textContent =
                isWrong(currentCategory)
                    ? `你已复习完该错题本（共 ${activeList.length} 题）`
                    : `你已完成「${currentCategory}」全部 ${activeList.length} 题`;

            // 统计：各分类进度 + 各分类错题数
            let statsHtml = '';
            const progress = loadProgress();
            Object.keys(quizData).forEach(cat => {
                const done = (progress[cat] || 0) + 1;
                const total = quizData[cat].length;
                statsHtml += `
                    <div class="stat-item">
                        <div>${cat}</div>
                        <div class="stat-number">${Math.min(done, total)}/${total}</div>
                        <div class="stat-label">已做到</div>
                    </div>
                `;
            });
            Object.keys(quizData).forEach(cat => {
                statsHtml += `
                    <div class="stat-item">
                        <div>${cat}·错题</div>
                        <div class="stat-number">${wrongCountOf(cat)}</div>
                        <div class="stat-label">待复习</div>
                    </div>
                `;
            });
            document.getElementById('stats').innerHTML = statsHtml;
        }

        // 完成页「重新开始」：回到当前分类第1题
        function restart() {
            resetProgress();
        }

        function updateProgress() {
            const percentage = ((currentQuestionIndex + 1) / activeList.length) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressText').textContent =
                `${currentQuestionIndex + 1} / ${activeList.length}`;
            document.getElementById('jumpInput').max = activeList.length;
        }

        // ===== 跳转 =====
        function jumpToQuestion() {
            if (activeList.length === 0) return;
            const input = document.getElementById('jumpInput');
            let n = parseInt(input.value, 10);
            if (isNaN(n)) { alert('请输入题号'); return; }
            if (n < 1) n = 1;
            if (n > activeList.length) n = activeList.length;
            currentQuestionIndex = n - 1;
            answered = false;
            input.value = '';
            renderCurrentView();
        }

        // ===== 重置当前分类进度 =====
        function resetProgress() {
            currentQuestionIndex = 0;
            answered = false;
            const map = loadProgress();
            map[currentCategory] = 0;
            saveProgressMap(map);
            renderCurrentView();
        }

        // ===== 已掌握，移出当前错题 =====
        function masterCurrent() {
            if (!isWrong(currentCategory) || activeList.length === 0) return;
            const pointer = activeList[currentQuestionIndex];
            removeWrong(pointer.category, pointer.index);
            activeList.splice(currentQuestionIndex, 1);
            if (currentQuestionIndex >= activeList.length) {
                currentQuestionIndex = Math.max(0, activeList.length - 1);
            }
            renderCategoryButtons();
            renderCurrentView();
        }

        // ===== 清空当前分类的错题本 =====
        function clearWrong() {
            if (!isWrong(currentCategory)) return;
            const cat = realCat(currentCategory);
            if (!confirm(`确定要清空「${cat}」的错题本吗？`)) return;
            const map = loadWrong();
            delete map[cat];
            saveWrong(map);
            activeList = buildActiveList(currentCategory);
            currentQuestionIndex = 0;
            renderCategoryButtons();
            renderCurrentView();
        }
